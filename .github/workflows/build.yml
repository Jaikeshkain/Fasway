name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1/M2/M3/M4)
          - runner: macos-15-intel  # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # python.org build, includes Tk for the QR window
      - run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fasway-mac-${{ runner.arch }}
          path: dist/Fasway-mac-*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fasway-mac-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: packaging\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Fasway-windows
          path: dist/Fasway-windows.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fasway-windows.zip
