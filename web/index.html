<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fasway</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <span class="brand">Fasway</span>
    <span id="status" class="status off"><i></i><b>Offline</b></span>
    <button id="screenBtn" class="icon-btn" aria-label="Show laptop screen">🖥</button>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <main>
    <!-- Touchpad -->
    <section id="tab-pad" class="tab active">
      <div id="screen" class="screen hidden">
        <video id="screenVid" autoplay playsinline muted></video>
        <div id="screenMsg" class="screen-msg">Connecting to screen…</div>
        <button id="screenSize" class="screen-size" aria-label="Resize preview">⤢</button>
      </div>
      <div id="pad">
        <div class="pad-hint">1 finger: move · tap: click<br>2 fingers: scroll · 2-finger tap: right click<br>double-tap &amp; drag: drag</div>
      </div>
      <div class="mouse-buttons">
        <button data-btn="left">Left</button>
        <button data-btn="middle" class="narrow">●</button>
        <button data-btn="right">Right</button>
      </div>
    </section>

    <!-- Voice -->
    <section id="tab-voice" class="tab">
      <div class="lang-row">
        <label for="lang">Language</label>
        <select id="lang">
          <option value="mix-roman">Mixed – Hinglish (Roman letters)</option>
          <option value="mix-deva">Mixed – हिंदी लिपि (Devanagari)</option>
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
        </select>
      </div>

      <div id="preview" class="preview"><span class="placeholder">Tap the mic and speak…</span></div>

      <button id="mic" class="mic" aria-label="Start dictation">
        <svg viewBox="0 0 24 24" width="44" height="44"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div id="micState" class="mic-state">Off</div>

      <label class="toggle"><input type="checkbox" id="review"> Review before sending</label>

      <div class="compose">
        <textarea id="text" rows="2" placeholder="Type here, or use your keyboard's mic…"></textarea>
        <button id="send">Send</button>
      </div>

      <div class="keys">
        <button data-key="backspace">⌫</button>
        <button data-key="ctrl+backspace">⌫ word</button>
        <button data-key="space">Space</button>
        <button data-key="enter">Enter ⏎</button>
        <button data-key="ctrl+z">Undo</button>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="pad" class="active">🖱️<span>Touchpad</span></button>
    <button data-tab="voice">🎙️<span>Voice</span></button>
  </nav>

  <!-- Settings sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-body">
      <h3>Settings</h3>
      <label>Pointer speed <output id="speedOut"></output>
        <input type="range" id="speed" min="0.5" max="4" step="0.1"></label>
      <label>Acceleration <output id="accelOut"></output>
        <input type="range" id="accel" min="0" max="3" step="0.1"></label>
      <label>Scroll speed <output id="scrollOut"></output>
        <input type="range" id="scrollSpeed" min="0.5" max="6" step="0.1"></label>
      <label class="toggle"><input type="checkbox" id="natural"> Natural scrolling</label>
      <label>Screen preview quality
        <select id="screenQuality">
          <option value="low">Low – smooth on weak Wi-Fi</option>
          <option value="medium">Medium (720p, 30 fps)</option>
          <option value="high">High (1080p, 30 fps)</option>
        </select></label>
      <label class="toggle"><input type="checkbox" id="haptics"> Vibrate on click</label>
      <button id="closeSheet">Done</button>
    </div>
  </div>

  <div id="noToken" class="overlay hidden">
    <div>
      <h2>Not paired</h2>
      <p>Run <b>Fasway</b> on your laptop and scan the QR code shown there.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
